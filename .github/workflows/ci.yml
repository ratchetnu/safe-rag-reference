name: ci

# Required checks. Safe offline suite only: no secrets, no paid APIs, no model calls.
# The embedder, reranker and answer model used here are deterministic stand-ins,
# not AI models; all metrics are on synthetic data and are not production numbers.
# Live-model evaluation is a separate, optional, manually triggered workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Typecheck
        run: python -m mypy
      - name: Unit tests
        run: pytest -m "not live and not postgres"
      - name: Offline evaluation - synthetic data, deterministic stand-ins (critical gates fail the build)
        run: saferag eval --output reports
      - name: Build
        run: python -m build
      - name: Safety scan
        run: python scripts/safety_scan.py
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: offline-eval-report
          path: reports/

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saferag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-retries 30
    env:
      SAFERAG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/saferag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Postgres + pgvector integration tests (RLS, scoped search)
        run: pytest -m postgres
